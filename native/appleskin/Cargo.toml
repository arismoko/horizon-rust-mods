[package]
name = "mod-appleskin"
version = "0.3.5"
edition = "2024"
license = "MIT"
description = "AppleSkin for Sunrise: held food, saturation and exhaustion on the HUD, and food values in tooltips"
# Ported from: AppleSkin (squeek502/AppleSkin, The Unlicense).
# Cargo's name and version are not the mod's identity: sunrise-mod.toml is.
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
